# Every name and address that is not a site of this server (the bare IP, old links): http goes to https://dosije.online,
# https is refused at the handshake (there is no certificate for those names). Installed by deploy/server-setup.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://dosije.online$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
