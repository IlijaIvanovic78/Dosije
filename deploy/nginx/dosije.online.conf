# dosije.online: the public address of Dosije (Docker listens only on 127.0.0.1:3100). Its own server blocks, apart from
# the catch-all site (deploy/nginx/catchall.conf) and any other site on the server. http:// and www go to
# https://dosije.online. Installed by deploy/domain-setup.sh once certbot holds the certificate.

map $http_upgrade $dosije_online_connection {
    default upgrade;
    ''      close;
}

# http: everything goes to https (certbot renewals put their own challenge location in while they run)
server {
    listen 80;
    listen [::]:80;
    server_name dosije.online www.dosije.online;

    location / {
        return 301 https://dosije.online$request_uri;
    }
}

# https://www.dosije.online -> https://dosije.online
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dosije.online;

    ssl_certificate /etc/letsencrypt/live/dosije.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosije.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dosije.online$request_uri;
}

# https://dosije.online: the app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dosije.online;

    ssl_certificate /etc/letsencrypt/live/dosije.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosije.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dosije_online_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # the live stream (WebSocket, or the SSE fallback) stays open for the whole run
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
